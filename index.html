<script>
/* preklady: všetky texty idú cez t('slovenský text'); angličtina z lang/en.json (cez http) alebo lang/en.js (aj file://); chýbajúci preklad = slovensky */

 const fresh=anim&&S.parc[anim]&&!(PO[anim]&&PO[anim].land);buildCoast(fresh?anim:null);buildRoads(fresh?anim:null);
 const vis=expansionVisible();
 for(const p of PARCELS){const id=p.id,own=S.parc[id];let o=PO[id];if(!o)o=PO[id]={g:new THREE.Group(),land:null,b:[null,null,null,null],st:[-1,-1,-1,-1],mk:null,mkA:null};
  if(!o.g.parent)parcRoot.add(o.g);
  const showMk=!own&&vis&&(!p.req||S.parc[p.req]);const av=showMk&&parcNeedOk(p);
  if(o.mk&&(!showMk||o.mkA!==av)){o.g.remove(o.mk);disposeTree(o.mk);o.mk=null}
  if(showMk&&!o.mk){o.mk=markerModel(id,av);o.mkA=av;o.g.add(o.mk)}

  for(let j=0;j<4;j++){const st=parcStage(own.b,j);if(st===o.st[j])continue;if(o.b[j]){o.g.remove(o.b[j]);disposeTree(o.b[j]);o.b[j]=null}
   if(st>=0){o.b[j]=buildObj(id,j,st);o.g.add(o.b[j]);if(anim===id&&st===0)popIn(o.b[j],fresh?1.2:0)}o.st[j]=st}}

 miniEnd(win,a>b?t('Výhra {a} : {b}!',{a,b}):a===b?t('Remíza {a} : {b}',{a,b}):t('Prehra {a} : {b}',{a,b}),t('Súper {m} mal silu {o}, tvoj tím {s}',{m:t(name),o,s})+(a>b&&!win?' · '+t('Na bonus treba aspoň 2 správne odpovede z 3.'):a<=b?' · '+t('Kúp lepších hráčov alebo odpovedz správne.'):''),p);
